[project]
name = "kw-dashboard"
version = "0.1.0"
requires-python = ">=3.12"
description = "Native HDMI touch-panel dashboard for Kubernetes clusters"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
runtime = [
    "PyQt5>=5.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
